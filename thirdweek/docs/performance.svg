<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc">
  <title id="title">题目生成性能</title>
  <desc id="desc">生成十道、一百道、一千道和一万道题目的耗时中位数</desc>
  <rect width="800" height="460" fill="#ffffff"/>
  <text x="400" y="36" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#17202a">题目生成耗时（5 次运行中位数）</text>
  <line x1="92" y1="390" x2="750" y2="390" stroke="#52606d" stroke-width="2"/>
  <line x1="92" y1="70" x2="92" y2="390" stroke="#52606d" stroke-width="2"/>
  <g font-family="sans-serif" font-size="13" fill="#52606d">
    <text x="82" y="394" text-anchor="end">0.00</text>
    <text x="82" y="317" text-anchor="end">0.03</text>
    <text x="82" y="240" text-anchor="end">0.06</text>
    <text x="82" y="163" text-anchor="end">0.09</text>
    <text x="82" y="86" text-anchor="end">0.12 秒</text>
  </g>
  <g stroke="#d9e2ec" stroke-width="1">
    <line x1="92" y1="313" x2="750" y2="313"/>
    <line x1="92" y1="236" x2="750" y2="236"/>
    <line x1="92" y1="159" x2="750" y2="159"/>
    <line x1="92" y1="82" x2="750" y2="82"/>
  </g>
  <g font-family="sans-serif" font-size="13" text-anchor="middle">
    <rect x="130" y="388" width="90" height="2" fill="#2f855a"/>
    <text x="175" y="378" fill="#17202a">0.000095 s</text>
    <text x="175" y="418" fill="#52606d">10</text>
    <rect x="285" y="387" width="90" height="3" fill="#2b6cb0"/>
    <text x="330" y="377" fill="#17202a">0.000992 s</text>
    <text x="330" y="418" fill="#52606d">100</text>
    <rect x="440" y="364" width="90" height="26" fill="#b7791f"/>
    <text x="485" y="354" fill="#17202a">0.010110 s</text>
    <text x="485" y="418" fill="#52606d">1,000</text>
    <rect x="595" y="61" width="90" height="329" fill="#c53030"/>
    <text x="640" y="51" fill="#17202a">0.128430 s</text>
    <text x="640" y="418" fill="#52606d">10,000</text>
  </g>
  <text x="421" y="448" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#52606d">生成题目数量（Python 3.12，-r 10）</text>
</svg>
